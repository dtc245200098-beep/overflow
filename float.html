<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bố cục bằng Float và Clear</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="left-column">
            <h2>Cột nội dung chính</h2>
            <p>Đây là khu vực chiếm 60% chiều rộng. Nội dung bài viết chính sẽ nằm ở đây.</p>
        </div>
        <div class="right-column">
            <h2>Cột Sidebar</h2>
            <p>Đây là khu vực chiếm 38% chiều rộng, dạt về bên phải.</p>
        </div>
    </div>

    <!-- Phần footer bên dưới để kiểm tra tác dụng của clear -->
    <div class="footer">
        <p>Chân trang (Footer) - Không bị dính hay đè lên 2 cột trên nhờ Clearfix.</p>
    </div>

</body>
</html>
