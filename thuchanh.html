<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo bố cục cơ bản</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Phân vùng main chứa toàn bộ nội dung -->
    <div id="main">
        
        <!-- Phân vùng đầu trang (Header) -->
        <div id="head">
            Header (Logo & Banner)
        </div>

        <!-- Phân vùng liên kết đầu trang (Nav/Menu) -->
        <div id="head-link">
            Home | Students | Course | About Us | Contact
        </div>

        <!-- Phân vùng bên trái (Sidebar trái) -->
        <div id="left">
            Cột trái (Left Sidebar)
        </div>

        <!-- Phân vùng nội dung chính (Content) -->
        <div id="content">
            Nội dung chính (Hot news, Photo Slide, News 1...)
        </div>

        <!-- Phân vùng bên phải (Sidebar phải) -->
        <div id="right">
            Cột phải (Lịch, Biểu đồ, Bản đồ...)
        </div>

        <!-- Phân vùng cuối trang (Footer) -->
        <div id="footer">
            Footer (Thông tin bản quyền & liên hệ)
        </div>

    </div>

</body>
</html>
